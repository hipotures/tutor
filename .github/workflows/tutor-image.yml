name: Tutor image

# Publishes the fork's Alpine image for HomeStack, e.g. tag tutor-0.1.0
# publishes ghcr.io/hipotures/tutor:0.1.0. The tag prefix keeps fork releases
# apart from upstream Vaultwarden tags (1.x.y) fetched into the fork.

on:
  push:
    tags: ['tutor-[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^tutor-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      # Releases are immutable: never overwrite a published version (e.g. on a
      # re-run of this workflow).
      - name: Refuse to overwrite a release
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ github.repository_owner }}/tutor
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE,,}:pull" | jq -r .token)
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE,,}/manifests/$TAG")
          if [[ "$status" == 200 ]]; then
            echo "ghcr.io/${IMAGE,,}:$TAG is already published" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: deploy/image/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VW_VERSION=tutor-${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=tutor-image
          cache-to: type=gha,scope=tutor-image,mode=max
          tags: ghcr.io/hipotures/tutor:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
