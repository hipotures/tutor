schema: 1
id: tutor
name: Tutor

image:
  repository: ghcr.io/hipotures/tutor

runtime:
  # Provisional defaults; built-image resource measurements are pending.
  resources:
    cores: 1
    memory: 256M
    swap: 0M
    rootfs: 512M
  ports:
    - name: web
      port: 80
      protocol: tcp
  healthcheck:
    type: http
    port: web
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60

persistence:
  mount: /home/app
  # Provisional capacity; durable-data and growth measurements are pending.
  size: 1G
  directories:
    - data

deployment:
  hostname: tutor
  instances: 1
  placement: single
  state_model: local

exposure:
  pangolin:
    port: web
    name: Tutor
    subdomain: tutor
